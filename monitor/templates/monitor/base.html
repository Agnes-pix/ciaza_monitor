<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Monitor Ciąży{% endblock %}</title>

    <!--
        {% load static %} = mówi Django że używamy plików statycznych
        MUSI być na początku każdego szablonu używającego % static %
    -->
    {% load static %}

    <!--
        {% static 'ścieżka' %} = Django zamienia to na pełny URL
        np. /static/monitor/css/bootstrap.min.css
        Pliki są serwowane Z NASZEGO SERWERA – nie z internetu!
    -->
    <link rel="stylesheet" href="{% static 'monitor/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'monitor/css/bootstrap-icons.min.css' %}">

    <style>
        /* Własne style nadpisujące Bootstrap */
        :root {
            --kolor-glowny: #880e4f;
            --kolor-jasny: #fce4ec;
        }
        body { background-color: #fce4ec; }
        .navbar { background: linear-gradient(135deg, #880e4f, #e91e8c) !important; }
        .card { border-radius: 12px; box-shadow: 0 2px 15px rgba(0,0,0,0.08); }
        .btn-rozowy { background-color: #e91e8c; border-color: #e91e8c; color: white; }
        .btn-rozowy:hover { background-color: #880e4f; border-color: #880e4f; color: white; }
    </style>
</head>
<body>

{% if user.is_authenticated %}
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold">
            <i class="bi bi-heart-pulse-fill me-2"></i>Monitor Ciąży
        </span>

        <!-- Przycisk hamburger na telefonie -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#nawigacja">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nawigacja">
            <div class="navbar-nav me-auto">
                {% if not user.is_staff %}
                    <!-- Zakładki pacjentki -->
                    <a class="nav-link" href="{% url 'dashboard' %}">
                        <i class="bi bi-house-fill me-1"></i>Strona główna
                    </a>
                    <a class="nav-link" href="{% url 'pomiary' %}">
                        <i class="bi bi-clipboard2-pulse me-1"></i>Moje dane
                    </a>
                {% else %}
                    <!-- Zakładka lekarza -->
                    <a class="nav-link" href="{% url 'panel_lekarza' %}">
                        <i class="bi bi-hospital me-1"></i>Panel lekarza
                    </a>
                {% endif %}
            </div>

            <!-- Użytkownik i wyloguj -->
            <div class="navbar-nav ms-auto align-items-center">
                <span class="navbar-text text-white me-3">
                    <i class="bi bi-person-circle me-1"></i>
                    {{ user.first_name }} {{ user.last_name }}
                </span>
                <a class="btn btn-outline-light btn-sm" href="{% url 'wyloguj' %}">
                    <i class="bi bi-box-arrow-right me-1"></i>Wyloguj
                </a>
            </div>
        </div>
    </div>
</nav>
{% endif %}

<div class="container pb-5">
    {% block content %}{% endblock %}
</div>

<!--
    Bootstrap JS na końcu body – przyspiesza ładowanie strony
    bundle = zawiera Popper.js (potrzebny do menu, tooltipów)
-->
<script src="{% static 'monitor/js/bootstrap.bundle.min.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
