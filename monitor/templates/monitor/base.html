<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Monitor Ciąży{% endblock %}</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'monitor/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'monitor/css/bootstrap-icons.min.css' %}">
    <link rel="stylesheet" href="{% static 'monitor/css/style.css' %}">
</head>
<body>

{% if user.is_authenticated %}
<nav class="navbar navbar-expand-lg navbar-dark navbar-glowna mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold">
            <i class="bi bi-heart-pulse-fill me-2"></i>Monitor Ciąży
        </span>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#nawigacja">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nawigacja">
            <div class="navbar-nav me-auto">
                {% if not user.is_staff %}
                    <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
                       href="{% url 'dashboard' %}">
                        <i class="bi bi-house-fill me-1"></i>Strona główna
                    </a>
                    <a class="nav-link {% if request.resolver_match.url_name == 'pomiary' %}active{% endif %}"
                       href="{% url 'pomiary' %}">
                        <i class="bi bi-clipboard2-pulse me-1"></i>Moje dane
                    </a>
                    <a class="nav-link {% if request.resolver_match.url_name == 'badania_pdf' %}active{% endif %}"
                       href="{% url 'badania_pdf' %}">
                        <i class="bi bi-file-earmark-medical me-1"></i>Wyniki badań
                    </a>
                {% else %}
                    <a class="nav-link {% if request.resolver_match.url_name == 'panel_lekarza' %}active{% endif %}"
                       href="{% url 'panel_lekarza' %}">
                        <i class="bi bi-hospital me-1"></i>Panel lekarza
                    </a>
                {% endif %}
            </div>

            <div class="navbar-nav ms-auto align-items-center">
                <span class="navbar-text text-white me-3">
                    <i class="bi bi-person-circle me-1"></i>
                    {{ user.first_name }} {{ user.last_name }}
                </span>
                <a class="btn btn-outline-light btn-sm" href="{% url 'wyloguj' %}">
                    <i class="bi bi-box-arrow-right me-1"></i>Wyloguj
                </a>
            </div>
        </div>
    </div>
</nav>
{% endif %}

<div class="container pb-5">
    {% block content %}{% endblock %}
</div>

<script src="{% static 'monitor/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'monitor/js/chart.umd.min.js' %}"></script>
<script src="{% static 'monitor/js/aplikacja.js' %}"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
